name: Cargo OTP review-only security tests

on:
  pull_request:
    paths:
      - "design/cargo-operator-draft-otp-binding.review.sql"
      - "integrations/cargo-draft-otp-binding/index.ts"
      - "cargo-request-otp-integration-preview.html"
      - "tests/cargo-draft-otp-security.test.cjs"
      - ".github/workflows/cargo-otp-review-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline contract tests (no secrets or network requests)
        run: node --test tests/cargo-draft-otp-security.test.cjs
