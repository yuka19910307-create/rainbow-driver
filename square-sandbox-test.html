<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rainbow Driver - Square Sandbox Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#111827;margin:0}
.wrap{max-width:560px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-top:24px}
h1{font-size:26px;margin:0 0 8px}.muted{color:#6b7280;line-height:1.55}.amount{font-size:34px;font-weight:800;margin:20px 0}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:#111827;color:#fff}
button:disabled{opacity:.5}.warn{background:#fff7ed;color:#92400e;border-radius:12px;padding:12px;margin:14px 0}
.ok{background:#ecfdf5;color:#065f46;border-radius:12px;padding:12px;margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Square Sandbox 決済テスト</h1>
    <div class="muted">Rainbow Driverの事前決済→依頼確定→Push通知を確認するテストです。実際のお金は動きません。</div>
    <div class="amount">¥2,800</div>
    <div class="muted">テスト内容：迎車1.0km（¥1,000）＋運転2.0km（¥1,800）</div>
    <div class="warn">Sandbox専用です。Squareのテストカードを使用してください。</div>
    <button id="startBtn" type="button">テスト決済を開始</button>
    <div id="status" class="muted" style="margin-top:12px"></div>
  </div>
</div>
<script>
(function(){
  var SUPABASE_URL='https://kvoaorzdewwirqryeizq.supabase.co';
  var SUPABASE_KEY='sb_publishable_RG3jeU_P22ZPMce6kREkeg_ukVyAlms';
  var API=SUPABASE_URL+'/functions/v1/square-payments';
  var btn=document.getElementById('startBtn');
  var status=document.getElementById('status');

  btn.onclick=async function(){
    btn.disabled=true;
    status.className='muted';
    status.textContent='Squareのテスト決済画面を準備中…';
    try{
      var r=await fetch(API,{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
        body:JSON.stringify({
          action:'create_checkout',
          customer_name:'Sandboxテスト',
          customer_phone:'',
          pickup_address:'Sandboxテスト迎車地点',
          destination_address:'Sandboxテスト目的地',
          pickup_lat:null,
          pickup_lng:null,
          destination_lat:null,
          destination_lng:null,
          pickup_distance_km:1,
          trip_distance_km:2,
          pickup_eta_min:5,
          trip_eta_min:8,
          notes:'Square Sandbox 決済テスト'
        })
      });
      var j={}; try{j=await r.json()}catch(e){}
      if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
      localStorage.setItem('rd_payment_session_id',j.payment_session_id||'');
      localStorage.setItem('rd_payment_session_token',j.payment_session_token||'');
      localStorage.setItem('rd_customer_token_pending',j.customer_token||'');
      status.className='ok';
      status.textContent='決済画面へ移動します…';
      location.href=j.checkout_url;
    }catch(e){
      status.className='warn';
      status.textContent='テスト開始エラー: '+(e.message||e);
      btn.disabled=false;
    }
  };
})();
</script>
</body>
</html>
