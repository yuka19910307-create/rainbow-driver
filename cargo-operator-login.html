<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>軽貨物ドライバーログイン | Rainbow Driver</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b304e;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}header{background:#193453;color:white;padding:26px 20px}header div,main{max-width:650px;margin:auto}h1{font-size:23px}main{padding:20px}section{background:white;border:1px solid #dce4ed;border-radius:15px;padding:22px;margin-bottom:15px}label{display:block;margin:14px 0 5px;font-weight:650}input{width:100%;font-size:17px;padding:13px;border:1px solid #bbcbdc;border-radius:9px}button{padding:13px 17px;border:0;border-radius:9px;background:#254368;color:white;font-size:16px;font-weight:700;margin-top:15px;cursor:pointer}button:disabled{opacity:.5}.sub{background:#e9eff5;color:#213a58}p{line-height:1.7}#message{white-space:pre-wrap;color:#a33838}small{color:#596a7c}a{color:#195b98}</style></head><body><header><div><small style="color:#c8d7e8">Rainbow Driver / 軽貨物専用</small><h1>ドライバー管理ログイン</h1></div></header><main><section id="login"><h2>ログイン</h2><p>登録済みのメールアドレスとパスワードを入力してください。運転請負アプリとは別の軽貨物専用画面です。</p><form id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">ログイン</button></form></section><section id="dashboard" hidden><h2>認証成功</h2><p id="account"></p><p>軽貨物の管理者権限が確認できました。現時点ではログイン接続テスト画面です。案件の受付・運賃確定・決済は行いません。</p><button class="sub" id="logout">ログアウト</button></section><section><small>このページではパスワードを保存しません。認証セッションはSupabaseが管理します。原価や案件情報は次の段階で専用の保護画面に移します。従来の試作計算ページには機密情報を入力しないでください。</small><p id="message" role="status"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),msg=s=>$('message').textContent=s;
if(!window.supabase){msg('認証ライブラリを読み込めませんでした。再読み込みしてください。');return}
const client=window.supabase.createClient('https://kvoaorzdewwirqryeizq.supabase.co','sb_publishable_RG3jeU_P22ZPMce6kREkeg_ukVyAlms',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'rd-cargo-operator-auth-v1'}});
let request=0;
async function refresh(){
 const n=++request;
 try{
  const {data:{user},error}=await client.auth.getUser();
  if(n!==request)return;
  if(error||!user){$('login').hidden=false;$('dashboard').hidden=true;return}
  const {data,error:accessError}=await client.from('cargo_operator_accounts').select('user_id').eq('user_id',user.id).maybeSingle();
  if(n!==request)return;
  if(accessError||!data){await client.auth.signOut();$('login').hidden=false;$('dashboard').hidden=true;msg('軽貨物の管理者権限を確認できませんでした。');return}
  $('account').textContent='ログイン中：'+(user.email||'登録済みユーザー');
  $('login').hidden=true;$('dashboard').hidden=false;msg('');
 }catch(e){msg('通信状況を確認してください。')}
}
$('form').addEventListener('submit',async e=>{
 e.preventDefault();$('submit').disabled=true;msg('ログインを確認中です…');
 try{
  const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  $('password').value='';
  if(error){msg('ログインできませんでした。メールアドレスとパスワードを確認してください。');return}
  await refresh();
 }catch(e){msg('通信エラーが発生しました。')}
 finally{$('submit').disabled=false}
});
$('logout').onclick=async()=>{await client.auth.signOut();++request;$('login').hidden=false;$('dashboard').hidden=true;$('password').value='';msg('ログアウトしました。')};
refresh();
})();
</script></body></html>
