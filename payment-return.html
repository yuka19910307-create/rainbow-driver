<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rainbow Driver - お支払い確認</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--ok:#065f46;--okbg:#ecfdf5;--warn:#92400e;--warnbg:#fff7ed}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0}
.wrap{max-width:560px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:28px}
h1{font-size:25px;margin:0 0 10px}.muted{color:var(--muted);line-height:1.6}.ok{background:var(--okbg);color:var(--ok);border-radius:12px;padding:13px;margin:16px 0}.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:13px;margin:16px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:#111827;color:#fff;text-align:center;text-decoration:none;margin-top:16px}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>お支払い確認</h1>
    <div id="message" class="muted">Squareのお支払い結果を確認しています…</div>
    <div id="detail" class="muted" style="margin-top:10px">この画面は閉じずにそのままお待ちください。</div>
    <a id="backBtn" class="btn hidden" href="/">依頼状況を確認する</a>
    <button id="retryBtn" class="btn hidden" type="button">もう一度確認する</button>
  </div>
</div>
<script>
(function(){
  var SUPABASE_URL='https://kvoaorzdewwirqryeizq.supabase.co';
  var SUPABASE_KEY='sb_publishable_RG3jeU_P22ZPMce6kREkeg_ukVyAlms';
  var API=SUPABASE_URL+'/functions/v1/square-payments';
  var message=document.getElementById('message');
  var detail=document.getElementById('detail');
  var backBtn=document.getElementById('backBtn');
  var retryBtn=document.getElementById('retryBtn');
  var tries=0,maxTries=20,timer=null;

  function get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function remove(k){try{localStorage.removeItem(k)}catch(e){}}
  function showOk(text,sub){
    message.className='ok';message.textContent=text;detail.textContent=sub||'';
    backBtn.classList.remove('hidden');retryBtn.classList.add('hidden');
  }
  function showWarn(text,sub,retry){
    message.className='warn';message.textContent=text;detail.textContent=sub||'';
    if(retry) retryBtn.classList.remove('hidden');
  }
  async function post(body){
    var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(body)});
    var j={};try{j=await r.json()}catch(e){}
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    return j;
  }
  async function check(){
    if(timer){clearTimeout(timer);timer=null}
    var params=new URLSearchParams(location.search);
    var urlSession=params.get('session')||'';
    var id=urlSession||get('rd_payment_session_id');
    var token=get('rd_payment_session_token');
    var customerToken=get('rd_customer_token_pending');
    if(!id||!token){
      showWarn('お支払い確認情報が見つかりません。','同じ端末・同じブラウザで決済画面から戻ってください。',false);
      return;
    }
    if(urlSession) set('rd_payment_session_id',urlSession);
    try{
      var j=await post({action:'status',payment_session_id:id,payment_session_token:token});
      var p=j.payment||{};
      if(p.status==='paid'&&p.request_id){
        if(customerToken){
          set('rd_request_id',p.request_id);
          set('rd_customer_token',customerToken);
        }
        remove('rd_payment_session_id');
        remove('rd_payment_session_token');
        remove('rd_customer_token_pending');
        showOk('お支払い・運転依頼の受付が完了しました。','ドライバーへ依頼通知を送信しました。下のボタンから依頼状況を確認できます。');
        return;
      }
      if(p.status==='failed'||p.status==='cancelled'||p.status==='expired'){
        showWarn('お支払いを完了できませんでした。','決済をやり直してください。',false);
        return;
      }
      tries++;
      message.className='muted';
      message.textContent='お支払いを確認しています…';
      detail.textContent='Squareの処理完了を待っています。';
      if(tries<maxTries){
        timer=setTimeout(check,1500);
      }else{
        showWarn('確認に少し時間がかかっています。','お支払いが完了している場合は、下のボタンでもう一度確認してください。',true);
      }
    }catch(e){
      showWarn('お支払い状況を確認できませんでした。',e.message||String(e),true);
    }
  }
  retryBtn.onclick=function(){tries=0;retryBtn.classList.add('hidden');check()};
  check();
})();
</script>
</body>
</html>
