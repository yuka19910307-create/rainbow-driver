name: Cargo disabled safety preparation

on:
  pull_request:
    paths:
      - "integrations/cargo-production-maintenance/**"
      - "integrations/cargo-safety-preparation/**"
      - "scripts/check-cargo-retention-preview.cjs"
      - "scripts/check-cargo-production-trial-preflight.cjs"
      - "scripts/prepare-cargo-monitor-notification.cjs"
      - "tests/cargo-retention-preview*.cjs"
      - "tests/cargo-notification-preparation.test.cjs"
      - "tests/cargo-operator-ip-policy.test.cjs"
      - "tests/cargo-production-trial-preflight.test.cjs"
      - ".github/workflows/cargo-safety-preparation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test new disabled preparation only (no services, mail or credentials)
        run: node --test tests/cargo-retention-preview.test.cjs tests/cargo-notification-preparation.test.cjs tests/cargo-operator-ip-policy.test.cjs tests/cargo-production-trial-preflight.test.cjs

  disposable-retention-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start isolated PostgreSQL (no Supabase connection)
        run: |
          docker run --detach --rm --name cargo-safety-ci-postgres \
            --env POSTGRES_PASSWORD=local-test-only postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec cargo-safety-ci-postgres pg_isready --host=127.0.0.1 --username=postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Compare read-only preview with existing cleanup in disposable transactions
        run: node tests/cargo-retention-preview-pg.test.cjs
      - name: Remove disposable database container
        if: always()
        run: docker rm --force cargo-safety-ci-postgres || true
