<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>検証用の認証保護キー | Rainbow Driver</title><style>body{font-family:-apple-system,sans-serif;background:#f0f4f9;color:#233650;margin:0;padding:20px;line-height:1.8}main{max-width:600px;margin:auto;background:white;padding:24px;border-radius:16px}h1{font-size:23px}input{box-sizing:border-box;width:100%;padding:12px;font-size:16px}button{display:block;width:100%;padding:15px;margin:15px 0;background:#27496e;color:white;border:0;border-radius:9px;font-size:17px}button:disabled{opacity:.5}label{display:block;margin-top:20px;font-weight:bold}a{color:#215d92}#status{white-space:pre-wrap}</style></head><body><main><h1>検証用の認証保護キー</h1><p>登録先：<strong>rainbow-driver-cargo-test</strong></p><p>キーは端末内で生成します。この画面から送信・保存しません。</p><button id="generate">認証保護キーを生成</button><label>Name</label><input readonly value="CARGO_INTAKE_HMAC_KEY"><label>Value</label><input id="key" type="password" readonly autocomplete="off"><button id="copy" disabled>キーをコピー</button><p id="status" role="status">未生成</p><p><a target="_blank" rel="noopener noreferrer" href="https://supabase.com/dashboard/project/hvdoqcrnztqmbzgwrovd/functions/secrets">検証プロジェクトのSecretsを開く</a></p><p>コピーしたキーをValueに貼り付け、Nameに上の名前を入力して保存してください。既に登録済みなら上書きせず、担当者へお知らせください。</p><button id="erase" disabled>登録後に画面のキーを消去</button><p>キーの値はチャットやスクリーンショットに含めないでください。</p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);$('generate').onclick=()=>{const b=crypto.getRandomValues(new Uint8Array(32));$('key').value=btoa(String.fromCharCode(...b));b.fill(0);$('generate').disabled=true;$('copy').disabled=false;$('erase').disabled=false;$('status').textContent='生成しました。キーをコピーして検証プロジェクトに登録してください。'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('key').value);$('status').textContent='コピーしました。検証プロジェクトのValueへ貼り付けてください。'}catch{$('status').textContent='コピーできませんでした。Safariで開いてください。'}};$('erase').onclick=()=>{if(!confirm('検証プロジェクトに保存しましたか？消去後は復元できません。'))return;$('key').value='';$('copy').disabled=true;$('erase').disabled=true;$('status').textContent='画面のキーを消去しました。'}})();</script></body></html>
