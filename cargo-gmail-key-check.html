<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; img-src 'none'; base-uri 'none'">
<title>軽貨物 Gmail署名キー照合 | Rainbow Driver</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19334c;background:#f0f4fa}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:0 auto;padding:20px}h1{font-size:24px}section{background:#fff;border:1px solid #d4e0ed;border-radius:16px;padding:20px;margin:16px 0}p{line-height:1.7}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;font-size:17px;padding:13px;border:1px solid #abc0d2;border-radius:9px}button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:10px;background:#244768;color:#fff;font-size:17px;font-weight:700}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4fa;padding:14px;border-radius:9px}.warn{color:#9a3426}.ok{color:#146b43}small{color:#62768a}.note{background:#fff3db;border-radius:12px;padding:12px}
</style>
</head>
<body><main>
<h1>Gmail署名キーの一致確認</h1>
<section>
<p><strong>メールは送信しません。</strong> Supabaseの設定もGoogle Apps Scriptも変更しません。</p>
<p class="note">この画面は端末内だけでSHA-256を計算します。入力されたキーと照合用ダイジェストは送信・保存しません。コード内でも通信を禁止しています。</p>
<label for="gas">① Google Apps Scriptの「BRIDGE_HMAC_SECRET」の値</label>
<input id="gas" type="password" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="64桁の英数字を貼り付け">
<label for="digest">② Supabase「CARGO_GMAIL_BRIDGE_HMAC_SECRET」のDIGEST</label>
<input id="digest" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="DIGESTの先頭8文字以上（可能なら全64文字）">
<p><small>SupabaseのDIGESTは秘密キーそのものではなく、照合に使うハッシュ値です。右側に表示されている値を使用してください。名前の異なる項目のDIGESTは使用しないでください。</small></p>
<button type="button" id="check">端末内でキーを照合</button>
<p id="result" role="status">未確認</p>
<p><small>結果の文言だけ報告してください。入力値や秘密キーのスクリーンショットは送らないでください。</small></p>
</section>
</main>
<script>
(function(){
"use strict";
const key=document.getElementById("gas"), digest=document.getElementById("digest"), output=document.getElementById("result"), button=document.getElementById("check");
button.addEventListener("click",async function(){
 const secret=key.value.trim();
 const expected=digest.value.trim().toLowerCase();
 key.value=""; digest.value="";
 output.className="";
 if(!/^[0-9a-fA-F]{64}$/.test(secret)){output.textContent="Google Apps Scriptのキーは64桁の16進数で入力してください。";output.className="warn";return;}
 if(!/^[0-9a-f]{8,64}$/.test(expected)){output.textContent="SupabaseのDIGESTは16進数で8〜64文字を入力してください。";output.className="warn";return;}
 if(!window.crypto||!window.crypto.subtle){output.textContent="このブラウザで端末内のSHA-256計算を利用できません。";output.className="warn";return;}
 try{
  const bytes=new TextEncoder().encode(secret);
  const hash=new Uint8Array(await crypto.subtle.digest("SHA-256",bytes));
  const actual=Array.from(hash,b=>b.toString(16).padStart(2,"0")).join("");
  if(actual.startsWith(expected)){
   output.textContent="一致しました：Google Apps ScriptのキーとSupabaseのDIGESTが対応しています。署名計算・稼働コード側を調べる必要があります。";
   output.className="ok";
  }else{
   output.textContent="一致しません：Google Apps ScriptのキーとSupabaseのDIGESTが異なります。秘密キーの不一致が原因です。";
   output.className="warn";
  }
 }catch(_){output.textContent="計算に失敗しました。";output.className="warn";}
});
})();
</script></body></html>
