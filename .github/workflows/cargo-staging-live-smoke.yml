name: Cargo staging live API smoke

on:
  pull_request:
    paths:
      - "staging/**"
      - "integrations/cargo-customer-intake/**"
      - "tests/cargo-staging-live-smoke.mjs"
      - ".github/workflows/cargo-staging-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe deployed staging endpoints (no customer data, email, or secrets)
        env:
          CARGO_STAGING_PUBLISHABLE_KEY: sb_publishable_A-f3WQb7Oh8uMqO4BJPPtg_l4c_JCfQ
        run: node tests/cargo-staging-live-smoke.mjs
